<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"
    />
    <title>你的旅程</title>
    <style>
      /* 配色照抄游戏本体（--bg/--ink/--amber），保证两屏放在一起不打架 */
      :root {
        --bg: #0c0b09;
        --bg2: #14120e;
        --ink: #e7dcc6;
        --ink2: #c9bda4;
        --dim: #877c6d;
        --amber: #dfa055;
        --amber2: #f6cf98;
        --line: rgba(231, 220, 198, 0.13);
        --ok: #8fbb9c;
        --bad: #c26a4a;
        --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
        --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #vig {
        position: fixed; inset: 0; pointer-events: none; z-index: 0;
        background: radial-gradient(120% 90% at 50% 30%, transparent 40%, rgba(0, 0, 0, 0.6) 100%);
      }
      main {
        position: relative; z-index: 1;
        flex: 1; overflow-y: auto;
        padding: 26px 30px 16px;
      }
      .kicker {
        font-family: var(--mono, monospace);
        font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
        color: var(--dim); margin-bottom: 8px;
      }
      h1 {
        font-family: var(--serif);
        font-size: 26px; line-height: 1.3; margin: 0 0 6px; font-weight: 500;
      }
      .sub { font-size: 12.5px; color: var(--dim); margin-bottom: 20px; }

      .grid {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;
      }
      .cell {
        border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
        background: rgba(255, 255, 255, 0.015);
      }
      .cell .k { font-size: 11px; color: var(--dim); margin-bottom: 4px; }
      .cell .v { font-size: 17px; color: var(--amber2); font-variant-numeric: tabular-nums; }
      .cell .u { font-size: 11px; color: var(--dim); margin-left: 2px; }

      .gems { display: flex; align-items: center; gap: 7px; margin: 2px 0 4px; }
      .gem {
        width: 15px; height: 15px; border-radius: 3px;
        background: linear-gradient(160deg, var(--amber2), var(--amber));
        box-shadow: 0 0 8px rgba(223, 160, 85, 0.35);
        transform: rotate(45deg);
      }
      .gem.dim { background: #3a352d; box-shadow: none; }
      .gem.off { background: transparent; border: 1px dashed rgba(231, 220, 198, 0.2); box-shadow: none; }

      blockquote {
        margin: 0 0 18px; padding: 12px 14px;
        border-left: 2px solid var(--amber);
        background: rgba(223, 160, 85, 0.06);
        font-family: var(--serif); font-size: 14.5px; color: var(--ink2); line-height: 1.7;
      }
      blockquote .from { display: block; margin-top: 6px; font-size: 11.5px; color: var(--dim); font-family: var(--sans); }

      .traits { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
      .tag {
        font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
        border: 1px solid var(--line); color: var(--ink2);
      }
      .tag.good { border-color: rgba(143, 187, 156, .45); color: var(--ok); }
      .tag.bad { border-color: rgba(194, 106, 74, .45); color: var(--bad); }

      footer {
        position: relative; z-index: 1;
        display: flex; gap: 10px; justify-content: flex-end;
        padding: 14px 30px 18px; border-top: 1px solid var(--line);
      }
      button {
        font-family: inherit; font-size: 13px; cursor: pointer;
        padding: 9px 18px; border-radius: 9px;
        border: 1px solid var(--line);
        background: transparent; color: var(--ink2);
        transition: background .15s, color .15s, border-color .15s;
      }
      button:hover { background: rgba(255, 255, 255, .05); color: var(--ink); }
      button.primary {
        background: var(--amber); color: #221a10; border-color: var(--amber); font-weight: 600;
      }
      button.primary:hover { background: var(--amber2); color: #221a10; }
      button:disabled { opacity: .5; cursor: default; }
      #err { color: var(--bad); font-size: 12px; margin-right: auto; align-self: center; }
    </style>
  </head>
  <body>
    <div id="vig"></div>
    <main>
      <div class="kicker" id="kicker">—</div>
      <h1 id="title">—</h1>
      <div class="sub" id="sub">—</div>

      <div class="grid">
        <div class="cell">
          <div class="k">原石</div>
          <div class="v"><span id="gemsText">0</span><span class="u">/ 5</span></div>
          <div class="gems" id="gems"></div>
        </div>
        <div class="cell">
          <div class="k">同伴</div>
          <div class="v" id="affinity" style="font-size: 15px">—</div>
        </div>
        <div class="cell">
          <div class="k">用时</div>
          <div class="v" id="elapsed" style="font-size: 15px">—</div>
        </div>
      </div>

      <div class="traits" id="traits"></div>

      <blockquote id="quote">
        —
        <span class="from" id="quoteFrom"></span>
      </blockquote>
    </main>

    <footer>
      <span id="err"></span>
      <button id="back">回到桌面</button>
      <button id="replay" class="primary">再玩一次</button>
    </footer>

    <script src="./finish.js"></script>
  </body>
</html>
